version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome_db
    environment:
      POSTGRES_USER: smarthome_admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: smarthome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome_admin -d smarthome"]
      interval: 10s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.25
    container_name: liquibase_runner
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./changelog:/liquibase/changelog
      - ./liquibase.properties:/liquibase/liquibase.properties
    command: ["update"]   # o "validate", "status", "update-sql", etc.
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/smarthome
      LIQUIBASE_COMMAND_USERNAME: smarthome_admin
      LIQUIBASE_COMMAND_PASSWORD: admin123
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/changelog-master.yaml

volumes:
  postgres_data: